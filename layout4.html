<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout 1</title>
    <link rel="stylesheet" href="grids.css">
     <style>
        .topo{
            border: 1px solid black;
            margin-bottom: 5px;
        }
        .menu{
            border: 1px solid black;
            height: 30px;
            margin-bottom: 5px;
        }

        .colunaA{
            border: 1px solid black;
            height: 400px;
            margin-bottom: 5px;
        }

        .colunaB{
            border: 1px solid black;
            height: 400px;
        }
        .colunaC{
            border: 1px solid black;
            height: 40px;
            margin-bottom: 5px;
        }
        .colunaD{
            border: 1px solid black;
            height: 40px;
            margin-bottom: 5px;
        }
        .colunaE{
            border: 1px solid black;
            height: 40px;
            margin-bottom: 5px;
        }

        .rodape{
            border: 1px solid black;
        }

     </style>
</head>
<body>

    <div class="container">

        <div class="row">
            <div class="col-12 topo">
                <h1>Topo</h1>
            </div>
        </div>

         <div class="row gap-1">
            <div class="col-3 colunaA">Coluna A</div>
            <div class="col-9 colunaB">Coluna B</div>
        </div>
        <div class="row gap-1">
            <div class="col-4 colunaC">Coluna C</div>
            <div class="col-4 colunaD">Coluna D</div>
            <div class="col-4 colunaE">Coluna E</div>
        </div>


        <div class="row">
            <div class="col-12 rodape">Rodapé</div>
        </div>

    </div>
    
</body>
</html>
